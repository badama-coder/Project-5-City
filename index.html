<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <div class="box-london">
            <img src="./london.webp" alt="london">
        </div>
        <div class="box-right">
            <div class="title">
                <div class="title1">Get London Quote</div>
                <div class="title2">All-Inclusive London Package</div>
            </div>
            <form action="">
                <div class="section">
                    <div class="label">Lead Passenger Name:</div>
                    <input class="input-box" type="text" placeholder="Erdenenavch Tumen-Ulzii" >
                </div>
                <div class="section">
                    <div class="label">Enter Active Number:</div>
                    <input class="input-box" type="text" placeholder="+976 9909 4165" >
                </div>
                <div class="section">
                    <div class="label">Enter Email:</div>
                    <input class="input-box" type="text" placeholder="erdenenavch@gmail.com" >
                </div>
                <div class="section">
                    <div class="label">Total Passengers:</div>
                    <input class="input-box" type="text" placeholder="i.e 2 adults & 2 kid" >
                    <div class="label2">I accept the 
                        <span>Privacy Policy</span>
                        <input class="checkbox" type="checkbox">
                    </div>
                </div>
                <input class="input-box" style="background-color: black; color: white;" type="submit" placeholder="Submit" >
            </form>

            
        </div>
    </div>
</body>
</html>
